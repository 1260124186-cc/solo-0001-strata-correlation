name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      race:
        description: 追加竞态检查（高成本，仅 Ubuntu，需 CGO）
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: "${{ matrix.os }}: build / vet / smoke"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: scripts/verify.sh build
      - name: vet
        run: scripts/verify.sh vet
      - name: smoke (record / seal / compare / browse)
        run: scripts/verify.sh smoke

  race:
    name: "ubuntu: race (optional, high cost)"
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.race }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: race (record / seal / compare / browse)
        run: scripts/verify.sh race
